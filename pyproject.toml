[project]
name = "scratchpad-scheduler-agent"
version = "0.1.0"
description = "MLSys 2026 Track B: Agent Reasoning Solution"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=1.0.0",
    "networkx>=3.6.1",
    "pydantic>=2.12.5",
    "python-dotenv>=1.0.0",
    "rich>=14.3.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Explicit package list — img/ and prompts/ are data dirs, not Python packages.
# metrics/ is a script dir (no __init__.py).
packages = ["agents", "core"]
py-modules = ["agent", "orchestrator"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# score.py inserts repo root into sys.path before imports — intentional
"metrics/score.py" = ["E402"]

[tool.black]
line-length = 110
target-version = ["py312"]
